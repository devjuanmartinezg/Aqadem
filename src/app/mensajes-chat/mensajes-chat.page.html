<ion-header>
  <ion-toolbar class="chat-header-toolbar">
    <!-- Botón de volver -->
    <ion-buttons slot="start">
      <ion-button class="back-button" (click)="goBack()" fill="clear">
        <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <!-- Título centrado -->
    <ion-title class="chat-header-title">
      {{ mensajeActual?.nombre || 'Chat' }}
    </ion-title>

    <!-- Botón de perfil -->
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="verPerfil()">
        <ion-icon name="person-circle-outline" class="perfil-icon"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-content">
  <div class="chat-messages">
    <div *ngFor="let msg of conversacion"
         [ngClass]="{'from-me': msg.fromMe, 'from-them': !msg.fromMe}"
         class="chat-message">
      <ion-avatar class="avatar-chat" (click)="goToPerfil(msg.userId)">
        <img [src]="getAvatar(msg.userId)" />
      </ion-avatar>
      <div class="bubble">
        <p>{{ msg.texto }}</p>
        <span class="hora">{{ msg.hora }}</span>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar class="chat-footer">
    <ion-input [(ngModel)]="nuevoMensaje" placeholder="Escribe un mensaje..."></ion-input>
    <ion-buttons slot="end">
      <ion-button (click)="enviarMensaje()">
        <ion-icon name="send"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
