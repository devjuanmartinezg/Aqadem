<ion-header>
  <ion-toolbar>
    <ion-title class="ion-text-center">Mis Clases</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleSearch()">
        <ion-icon name="search-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- aria-label="search-btn" -->

<ion-content class="clases-content" fullscreen>
  <ion-button expand="block" (click)="toggleSearch()">Probar búsqueda</ion-button>
  <ion-button expand="block">Login</ion-button>
  <!-- 🔍 Buscador dentro del content -->
  <ion-toolbar *ngIf="showSearch">
    <ion-searchbar
      [(ngModel)]="searchText"
      (ionInput)="filterClases()"
      (ionClear)="onClear()"
      placeholder="Buscar asignatura..."
      debounce="200"
      autofocus>
    </ion-searchbar>
  </ion-toolbar>

  <!-- 📚 Lista de clases -->
  <ion-card *ngFor="let clase of filteredClases" class="clase-card">
    <ion-item lines="none">
      <ion-avatar slot="start" [ngClass]="getAvatarClass(clase.icon)">
        <ion-icon [name]="clase.icon"></ion-icon>
      </ion-avatar>

      <ion-label class="ion-text-wrap">
        <h2>{{ clase.nombre }}</h2>
        <p>
          <ion-icon name="time-outline"></ion-icon> {{ clase.horario }}
          <ion-icon name="location-outline" class="ml-3"></ion-icon> {{ clase.salon }}
        </p>
      </ion-label>

      <ion-button fill="clear" slot="end" class="btn-detalles">
        Ver detalles
      </ion-button>
    </ion-item>

    <ion-item lines="none">
      <ion-icon slot="start" name="people-outline"></ion-icon>
      <ion-label>{{ clase.alumnos }} Alumnos</ion-label>
    </ion-item>
  </ion-card>

</ion-content>
