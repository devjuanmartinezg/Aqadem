<ion-header>
  <ion-toolbar class="header-toolbar">
    <ion-title class="ion-text-center">Mis Grupos</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleSearch()">
        <ion-icon name="search-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="clases-content" fullscreen>

  <ion-spinner *ngIf="loading" class="spinner-center" name="crescent" color="primary"></ion-spinner>

  <ion-toolbar *ngIf="showSearch" class="search-toolbar">
    <ion-searchbar
      [(ngModel)]="searchText"
      (ionInput)="filterClases()"
      (ionClear)="onClear()"
      placeholder="Buscar grupo..."
      debounce="200"
      autofocus>
    </ion-searchbar>
  </ion-toolbar>

  <ion-card *ngFor="let clase of filteredClases" class="clase-card">
    <ion-item lines="none">
      <ion-avatar slot="start" [ngClass]="getAvatarClass(clase.icon)" style="display: flex; justify-content: center; align-items: center;">
        <ion-icon [name]="clase.icon" size="large"></ion-icon>
      </ion-avatar>

      <ion-label class="ion-text-wrap">
        <h2>{{ clase.nombre }}</h2>
        <p>
          <ion-icon name="time-outline"></ion-icon> {{ clase.horario }}
          <ion-icon name="location-outline" class="ml-3"></ion-icon> {{ clase.salon }}
        </p>
      </ion-label>

      <ion-button fill="clear" slot="end" class="btn-detalles" (click)="verDetalles(clase)">
        Ver detalles
      </ion-button>
    </ion-item>

    <ion-item lines="none">
      <ion-icon slot="start" name="people-outline"></ion-icon>
      <ion-label>{{ clase.alumnos }} Alumnos</ion-label>
    </ion-item>
  </ion-card>

</ion-content>
