<ion-content class="loginContent ion-padding">
  <div class="divCentraje1">
    <div class="divCentraje2">
      <div class="loginImageWrapper">
        <ion-img src="assets/icon/aqadem2.png" class="loginImage"></ion-img>
      </div>

      <ion-item>
        <ion-label position="floating">Código de centro</ion-label>
        <ion-input (ionInput)="onInputChange($event)" [(ngModel)]="codigoCentro" maxlength="20" type="text"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Usuario</ion-label>
        <ion-input (ionInput)="onInputChange($event)" [(ngModel)]="username" maxlength="20" type="text"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input (ionInput)="onInputChange($event)" [(ngModel)]="password" maxlength="20" type="password"></ion-input>
      </ion-item>

      <ion-text color="danger" *ngIf="errorMessage">
        <p class="ion-padding warningP">{{ errorMessage }}</p>
      </ion-text>

      <ion-button expand="block" (click)="login()">Login</ion-button>
    </div>
  </div>
</ion-content>
