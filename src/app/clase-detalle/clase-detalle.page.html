<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ claseNombre }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Spinner centrado -->
  <div *ngIf="loading" class="spinner-center">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando alumnos...</p>
  </div>

  <!-- Mensaje de API Status -->
  <p *ngIf="!loading && apiStatus">{{ apiStatus }}</p>

  <!-- Lista de alumnos -->
  <ion-list *ngIf="!loading && alumnos.length > 0">
    <ion-item button *ngFor="let alumno of alumnos" (click)="verDetallesAlumno(alumno)">
      
      <ion-avatar slot="start" *ngIf="alumno.foto?.content">
        <img [src]="'data:image/jpeg;base64,' + alumno.foto.content" alt="Foto de {{ alumno.RazonSocial }}">
      </ion-avatar>

      <ion-icon *ngIf="!alumno.foto?.content" slot="start" name="person-circle-outline" color="primary" class="user-icon-size"></ion-icon>

      <ion-label>
        <h3>{{ alumno.RazonSocial }} {{ alumno.NombreComercial }}</h3>
        <p>ID: {{ alumno.ID }}</p>
        <p *ngIf="alumno.FechaNacimiento">Fecha de nacimiento: {{ alumno.FechaNacimiento | date:'dd/MM/yyyy' }}</p>
        <p *ngIf="alumno.Poblacion">Ciudad: {{ alumno.Poblacion }}</p>
      </ion-label>

    </ion-item>
  </ion-list>

</ion-content>

<ion-fab slot="fixed" vertical="bottom" horizontal="end">
  <ion-fab-button color="primary">
    <ion-icon name="chevron-up-circle"></ion-icon>
  </ion-fab-button>
  <ion-fab-list side="top">
    <ion-fab-button color="primary">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
    <ion-fab-button color="primary" (click)="irATomarAsistencia()">
      <ion-icon name="checkmark"></ion-icon>
    </ion-fab-button>
  </ion-fab-list>
</ion-fab>

<!-- CSS rápido dentro del HTML -->
<style>
.spinner-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-top: 50px;
}
.user-icon-size {
  font-size: 40px;
}
</style>
