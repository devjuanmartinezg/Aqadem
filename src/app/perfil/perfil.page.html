<ion-header>
  <ion-toolbar class="header-toolbar">
    <ion-title class="header-title">Mi Perfil</ion-title>

    <!-- 
    =====================================
    BOTÓN DE EDICIÓN (COMENTADO)
    =====================================

    <ion-buttons slot="end">
      <ion-button color="success" fill="clear" (click)="editarPerfil()" class="edit-button">
        Editar
      </ion-button>
    </ion-buttons>
    -->
  </ion-toolbar>
</ion-header>

<ion-content class="perfil-content">

  <!-- Cabecera del perfil: avatar grande + nombre + email -->
  <div class="perfil-header">
    <div class="avatar-wrapper">
      <!-- Foto del usuario de ejemplo -->
      <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="Foto de perfil" class="avatar-image" />

      <!-- Botón para cambiar la foto (abre acción o modal) -->
      <ion-fab-button size="small" color="success" (click)="cambiarFoto()" class="camera-button">
        <ion-icon name="camera-outline"></ion-icon>
      </ion-fab-button>
    </div>

    <!-- Nombre y correo del usuario -->
    <h2 class="usuario-nombre">{{ usuario.nombre }}</h2>
    <p class="usuario-email">{{ usuario.email }}</p>
  </div> <!-- cierre correcto de perfil-header -->

  <!-- Datos de contacto del usuario -->
  <div class="perfil-info">

    <!-- Teléfono -->
    <div class="info-card">
      <div class="info-icon-wrapper">
        <ion-icon name="call-outline" class="info-icon"></ion-icon>
      </div>
      <div class="info-content">
        <p class="info-text">{{ usuario.telefono }}</p>
      </div>
    </div>

    <!-- Email -->
    <div class="info-card">
      <div class="info-icon-wrapper">
        <ion-icon name="mail-outline" class="info-icon"></ion-icon>
      </div>
      <div class="info-content">
        <p class="info-text">{{ usuario.email }}</p>
      </div>
    </div>
  </div>

  <!-- Sección con las asignaturas del profesor -->
  <div class="perfil-section">
    <h3>Mis Asignaturas</h3>
    <div class="asignaturas">
      <!-- Cada asignatura se muestra en un chip -->
      <ion-chip *ngFor="let asignatura of usuario.asignaturas" color="warning">
        {{ asignatura }}
      </ion-chip>
    </div>
  </div>

  <!-- 
  =====================================
  SECCIÓN DE BIOGRAFÍA (COMENTADA)
  =====================================

  <div class="perfil-section">
    <h3>Biografía</h3>
    <ion-card class="bio-card">
      <ion-card-content>
        {{ usuario.biografia }}
      </ion-card-content>
    </ion-card>
  </div>
  -->

  <!-- Botón para cerrar sesión -->
  <div class="logout-section">
    <ion-button expand="block" fill="solid" color="danger" (click)="cerrarSesion()" class="logout-button">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Cerrar Sesión
    </ion-button>
  </div>
</ion-content>
