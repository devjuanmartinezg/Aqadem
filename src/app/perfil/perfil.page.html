<ion-header>
  <ion-toolbar>
    <ion-title class="ion-text-center">Mi Perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button color="success" fill="clear" (click)="editarPerfil()">
        Editar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="perfil-content">
  <div class="perfil-header">
    <div class="avatar-wrapper">
      <img [src]="usuario.avatar" alt="Foto de perfil" />
      <ion-fab-button size="small" color="success" (click)="cambiarFoto()">
        <ion-icon name="camera-outline"></ion-icon>
      </ion-fab-button>
    </div>

    <h2>{{ usuario.nombre }}</h2>
    <p class="email">{{ usuario.email }}</p>
  </div>

  <div class="perfil-info">
    <ion-item lines="none">
      <ion-icon name="call-outline" slot="start" color="success"></ion-icon>
      <ion-label>{{ usuario.telefono }}</ion-label>
    </ion-item>

    <ion-item lines="none">
      <ion-icon name="mail-outline" slot="start" color="success"></ion-icon>
      <ion-label>{{ usuario.email }}</ion-label>
    </ion-item>
  </div>

  <div class="perfil-section">
    <h3>Mis Asignaturas</h3>
    <div class="asignaturas">
      <ion-chip *ngFor="let asignatura of usuario.asignaturas" color="warning">
        {{ asignatura }}
      </ion-chip>
    </div>
  </div>

  <div class="perfil-section">
    <h3>Biografía</h3>
    <ion-card class="bio-card">
      <ion-card-content>
        {{ usuario.biografia }}
      </ion-card-content>
    </ion-card>
  </div>

  <div class="logout-section">
    <ion-button expand="block" fill="clear" color="danger" (click)="cerrarSesion()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Cerrar Sesión
    </ion-button>
  </div>
</ion-content>
