<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Pasar Lista - {{ claseCodigo }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div *ngIf="alumnosAsistencia.length === 0" class="ion-text-center">
    <ion-spinner></ion-spinner>
    <p>Cargando alumnos...</p>
  </div>

  <ion-list *ngIf="alumnosAsistencia.length > 0">
    <ion-item *ngFor="let alumno of alumnosAsistencia">
      
      <!-- Icono -->
      <ion-avatar slot="start" *ngIf="alumno.foto?.content">
        <img [src]="'data:image/jpeg;base64,' + alumno.foto.content" alt="Foto de {{ alumno.RazonSocial }}">
      </ion-avatar>

      <ion-icon
        *ngIf="!alumno.foto?.content"
        slot="start"
        name="person-circle-outline"
        color="primary"
        class="user-icon-size">
      </ion-icon>

      <!-- Datos del alumno -->
      <ion-label>
        <h3>{{ alumno.RazonSocial }} {{ alumno.NombreComercial }}</h3>
        <p>ID: {{ alumno.ID }}</p>
      </ion-label>

      <!-- Controles de asistencia -->
      <ion-segment [(ngModel)]="alumno.asistencia" class="asistencia-segment">
        <ion-segment-button value="P" title="Presente">
          <ion-icon name="checkmark-circle"></ion-icon>
        </ion-segment-button>
        <ion-segment-button value="A" title="Ausente">
          <ion-icon name="close-circle"></ion-icon>
        </ion-segment-button>
        <ion-segment-button value="J" title="Justificada">
          <ion-icon name="alert-circle"></ion-icon>
        </ion-segment-button>
      </ion-segment>

    </ion-item>
  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar color="primary">
    <ion-button 
      expand="full" 
      size="large" 
      (click)="guardarAsistencia()"
    >
      <ion-icon name="save-outline" slot="start"></ion-icon>
      Guardar Asistencia
    </ion-button>
  </ion-toolbar>
</ion-footer>
